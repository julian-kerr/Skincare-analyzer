<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Skincare Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px;
      background: #f8f7f4;
      color: #263238;
    }

    h1 {
      color: #315c4a;
      margin-bottom: 32px;
    }

    form,
    article,
    #concerns>div {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    form {
      display: grid;
      gap: 16px;
    }

    button {
      width: fit-content;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #315c4a;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #244536;
    }

    article h3 {
      color: #315c4a;
      margin-top: 0;
    }

    #concerns>div {
      display: inline-block;
      margin-right: 12px;
      padding: 14px 18px;
    }

    a {
      color: #315c4a;
      font-weight: bold;
    }

    #results {
      margin-top: 32px;
    }

    #concerns p {
      margin-bottom: 0;
      color: #526067;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>AI Skincare Analyzer</h1>

  <form id="upload-form">
    <label for="image">Upload a skin photo:</label>
    <input type="file" id="image" accept="image/*" capture="environment" required> <br>

    <label>
      <input type="checkbox" id="sensitive-skin">
      I have sensitive skin
    </label>

    <br><br>

    <label for="budget">Budget:</label>
    <select id="budget" required>
      <option value="">Choose a budget</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <br><br>

    <button type="submit">Analyze Image</button>
  </form>

  <p id="status"></p>
  <section id="results" hidden>
    <h2>Detected concerns</h2>
    <div id="concerns"></div>

    <h2>Recommended products</h2>
    <div id="recommendations"></div>
  </section>

  <script>
    const form = document.getElementById("upload-form");
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const concerns = document.getElementById("concerns");
    const recommendations = document.getElementById("recommendations");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const imageFile = document.getElementById("image").files[0];

      const formData = new FormData();
      formData.append("image", imageFile);
      formData.append(
        "sensitive_skin",
        document.getElementById("sensitive-skin").checked
      );
      formData.append(
        "budget",
        document.getElementById("budget").value
      );

      status.textContent = "Analyzing image...";
      results.hidden = true;
      concerns.innerHTML = "";
      recommendations.innerHTML = "";

      try {
        const response = await fetch("http://10.0.0.74:8000/analyze", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Upload failed");
        }

        status.textContent = "Analysis complete.";
        results.hidden = false;

        data.analysis.detected_concerns.forEach((concern) => {
          const concernCard = document.createElement("div");

          concernCard.innerHTML = `
          <strong>${concern.name}</strong>
          <span>${Math.round(concern.confidence * 100)}% confidence</span>
          <p>
            ${concern.evidence ||
              "The model detected visual indicators related to this concern."}
          </p>
        `;

          concerns.appendChild(concernCard);
        });

        data.recommendations.forEach((product) => {
          const productCard = document.createElement("article");

          productCard.innerHTML = `
        <h3>${product.name}</h3>
        <p><strong>Brand:</strong> ${product.brand}</p>
        <p><strong>Category:</strong> ${product.category}</p>
        <p><strong>Match score:</strong> ${product.match_score}</p>
        <p><strong>Ingredients:</strong>
            ${product.ingredients.join(", ")}
        </p>
        <p><strong>How to use:</strong> ${product.usage}</p>
        <p><strong>Frequency:</strong> ${product.frequency}</p>
        <p><strong>Warnings:</strong> ${product.warnings}</p>
        <p><strong>Why it matched:</strong>
            ${product.match_reasons.join(" • ")}
        </p>
        <a href="${product.url}" target="_blank" rel="noopener noreferrer">
            View on Olive Young
        </a>
        `;

          recommendations.appendChild(productCard);
        });
      } catch (error) {
        status.textContent = "Something went wrong.";
        console.error(error);
      }
    });
  </script>
</body>

</html>
